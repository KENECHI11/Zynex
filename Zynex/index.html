<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zynex Clothing Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.9/babel.min.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const products = [
      { id: 1, name: "Graphic Hoodie", price: 5500, img: "https://images.unsplash.com/photo-1556821840-3a63f719e1a8?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60", category: "streetwear" },
      { id: 2, name: "Oversized Tee", price: 3000, img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60", category: "streetwear" },
      { id: 3, name: "Tech Sweatshirt", price: 6000, img: "https://images.unsplash.com/photo-1601333146930-879c1a4e8158?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60", category: "athleisure" },
      { id: 4, name: "Performance Leggings", price: 4000, img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60", category: "athleisure" }
    ];

    const Navbar = () => (
      <nav className="bg-black text-white p-4 sticky top-0 z-50">
        <div className="container mx-auto flex justify-between items-center">
          <h1 className="text-2xl font-bold">Zynex</h1>
          <div className="space-x-6">
            <a href="#home" className="hover:text-green-400">Home</a>
            <a href="#shop" className="hover:text-green-400">Shop</a>
            <a href="#cart" className="hover:text-green-400">Cart</a>
            <a href="#about" className="hover:text-green-400">About</a>
            <a href="#contact" className="hover:text-green-400">Contact</a>
          </div>
        </div>
      </nav>
    );

    const Hero = () => (
      <section id="home" className="relative h-screen bg-cover bg-center" style={{ backgroundImage: "url('https://images.unsplash.com/photo-1523381294911-8d3cead13475?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80')" }}>
        <div className="absolute inset-0 bg-black opacity-50"></div>
        <div className="relative container mx-auto h-full flex flex-col justify-center items-center text-white text-center">
          <h2 className="text-5xl font-bold mb-4">Elevate Your Style with Zynex</h2>
          <p className="text-xl mb-6">Discover bold streetwear and sleek athleisure crafted for Nepal</p>
          <a href="#shop" className="bg-green-500 text-black px-6 py-3 rounded-full font-semibold hover:bg-green-400">Shop Now</a>
        </div>
      </section>
    );

    const ProductCard = ({ product, addToCart }) => (
      <div className="bg-white rounded-lg shadow p-4 text-center">
        <img src={product.img} alt={product.name} className="w-full h-48 object-cover rounded mb-4" />
        <h3 className="text-lg font-semibold">{product.name}</h3>
        <p className="text-gray-600">NPR {product.price}</p>
        <button onClick={() => addToCart(product)} className="mt-3 bg-black text-white px-4 py-2 rounded hover:bg-gray-800 w-full">Add to Cart</button>
      </div>
    );

    const Shop = ({ products, addToCart }) => (
      <section id="shop" className="py-12">
        <div className="container mx-auto max-w-6xl">
          <h2 className="text-3xl font-bold mb-6 text-center">Our Collection</h2>
          <div className="mb-8">
            <h3 className="text-2xl font-semibold mb-4">Streetwear</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
              {products
                .filter(product => product.category === 'streetwear')
                .map(product => (
                  <ProductCard key={product.id} product={product} addToCart={addToCart} />
                ))}
            </div>
          </div>
          <div>
            <h3 className="text-2xl font-semibold mb-4">Athleisure</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
              {products
                .filter(product => product.category === 'athleisure')
                .map(product => (
                  <ProductCard key={product.id} product={product} addToCart={addToCart} />
                ))}
            </div>
          </div>
        </div>
      </section>
    );

    const Cart = ({ cart, setCart, proceedToCheckout }) => (
      <section id="cart" className="py-12">
        <div className="container mx-auto max-w-2xl">
          <h2 className="text-2xl font-bold mb-6">Your Cart</h2>
          {cart.length === 0 ? (
            <p className="text-gray-600">Your cart is empty.</p>
          ) : (
            <>
              <ul className="space-y-4 mb-6">
                {cart.map((item, index) => (
                  <li key={index} className="bg-white p-4 rounded shadow flex justify-between items-center">
                    <div>
                      <div>{item.name} - NPR {item.price} x {item.quantity}</div>
                      <input
                        type="number"
                        min="1"
                        value={item.quantity}
                        onChange={(e) => {
                          const newCart = [...cart];
                          newCart[index].quantity = +e.target.value;
                          setCart(newCart);
                        }}
                        className="w-16 p-1 border rounded mt-2"
                      />
                    </div>
                    <button onClick={() => setCart(cart.filter((_, i) => i !== index))} className="text-red-500 hover:text-red-700">Remove</button>
                  </li>
                ))}
              </ul>
              <div className="text-right font-bold mb-4">
                Total: NPR {cart.reduce((sum, item) => sum + item.price * item.quantity, 0)}
              </div>
              <button onClick={proceedToCheckout} className="bg-green-500 text-black px-6 py-2 rounded hover:bg-green-400">Proceed to Checkout</button>
            </>
          )}
        </div>
      </section>
    );

    const Checkout = ({ cart, placeOrder }) => {
      const [form, setForm] = useState({
        name: '',
        email: '',
        address: '',
        phone: '',
        payment: 'COD'
      });

      const handleChange = (e) => {
        const { name, value } = e.target;
        setForm({ ...form, [name]: value });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const order = {
          customer: form,
          items: cart,
          total: cart.reduce((sum, item) => sum + item.price * item.quantity, 0),
          paymentMethod: form.payment
        };

        try {
          const response = await fetch('http://localhost:5000/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(order)
          });

          if (response.ok) {
            alert('Order placed successfully!');
            placeOrder(form, cart);
            setForm({ name: '', email: '', address: '', phone: '', payment: 'COD' });
          } else {
            alert('Failed to send order.');
          }
        } catch (error) {
          alert('Server error: Could not send order.');
          console.error(error);
        }
      };

      return (
        <section className="py-12 bg-gray-50">
          <div className="container mx-auto max-w-xl">
            <h2 className="text-2xl font-bold mb-6">Checkout</h2>
            <form onSubmit={handleSubmit} className="space-y-4">
              <input
                type="text"
                name="name"
                value={form.name}
                placeholder="Full Name"
                required
                onChange={handleChange}
                className="w-full p-2 border rounded"
              />
              <input
                type="email"
                name="email"
                value={form.email}
                placeholder="Email"
                required
                onChange={handleChange}
                className="w-full p-2 border rounded"
              />
              <input
                type="text"
                name="address"
                value={form.address}
                placeholder="Address (Street, Ward, District)"
                required
                onChange={handleChange}
                className="w-full p-2 border rounded"
              />
              <input
                type="tel"
                name="phone"
                value={form.phone}
                placeholder="Phone Number"
                required
                onChange={handleChange}
                className="w-full p-2 border rounded"
              />
              <div>
                <label className="font-semibold">Payment Method:</label>
                <div className="mt-1">
                  <label>
                    <input
                      type="radio"
                      name="payment"
                      value="COD"
                      checked={form.payment === 'COD'}
                      onChange={handleChange}
                    /> Cash on Delivery (COD)
                  </label>
                </div>
              </div>
              <button type="submit" className="bg-black text-white px-6 py-2 rounded hover:bg-gray-800">Place Order</button>
            </form>
          </div>
        </section>
      );
    };

    const OrderConfirmation = ({ customer, cart }) => (
      <section className="py-12 text-center">
        <div className="container mx-auto max-w-xl">
          <h2 className="text-2xl font-bold mb-4">Thank you, {customer.name}!</h2>
          <p className="mb-4">Your order has been placed and will be delivered to:</p>
          <p className="mb-4">{customer.address} | Phone: {customer.phone}</p>
          <p className="mb-6">Payment Method: {customer.payment}</p>
          <div className="bg-white p-4 rounded shadow text-left">
            <h3 className="font-semibold mb-2">Order Summary:</h3>
            <ul className="list-disc ml-5">
              {cart.map((item, index) => (
                <li key={index}>{item.name} - NPR {item.price} x {item.quantity}</li>
              ))}
            </ul>
            <p className="mt-4 font-bold">Total: NPR {cart.reduce((sum, item) => sum + item.price * item.quantity, 0)}</p>
          </div>
        </div>
      </section>
    );

    const About = () => (
      <section id="about" className="py-12 bg-gray-50">
        <div className="container mx-auto max-w-2xl text-center">
          <h2 className="text-2xl font-bold mb-6">About Zynex</h2>
          <p className="text-gray-600">
            Zynex is Nepal's premier clothing brand, offering bold streetwear and sleek athleisure. We craft high-quality, sustainable pieces designed to inspire confidence and individuality across Kathmandu and beyond.
          </p>
        </div>
      </section>
    );

    const Contact = () => {
      const [form, setForm] = useState({ name: '', email: '', message: '' });

      const handleChange = (e) => {
        setForm({ ...form, [e.target.name]: e.target.value });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          const response = await fetch('http://localhost:5000/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(form)
          });
          if (response.ok) {
            alert('Message sent successfully!');
            setForm({ name: '', email: '', message: '' });
          } else {
            alert('Failed to send message.');
          }
        } catch (error) {
          alert('Server error: Could not send message.');
        }
      };

      return (
        <section id="contact" className="py-12 bg-gray-200">
          <div className="container mx-auto max-w-xl text-center">
            <h2 className="text-2xl font-bold mb-6">Contact Us</h2>
            <form onSubmit={handleSubmit} className="space-y-4">
              <input
                type="text"
                name="name"
                value={form.name}
                onChange={handleChange}
                required
                placeholder="Your Name"
                className="w-full p-2 border rounded"
              />
              <input
                type="email"
                name="email"
                value={form.email}
                onChange={handleChange}
                required
                placeholder="Your Email"
                className="w-full p-2 border rounded"
              />
              <textarea
                name="message"
                value={form.message}
                onChange={handleChange}
                required
                placeholder="Your Message"
                className="w-full p-2 border rounded h-32"
              />
              <button type="submit" className="bg-black text-white px-6 py-2 rounded hover:bg-gray-800">Send Message</button>
            </form>
          </div>
        </section>
      );
    };

    const App = () => {
      const [cart, setCart] = useState([]);
      const [checkoutStarted, setCheckoutStarted] = useState(false);
      const [orderPlaced, setOrderPlaced] = useState(false);
      const [customer, setCustomer] = useState(null);
      const [orderedCart, setOrderedCart] = useState([]);

      const addToCart = (product) => {
        const existingItem = cart.find(item => item.id === product.id);
        if (existingItem) {
          setCart(cart.map(item =>
            item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
          ));
        } else {
          setCart([...cart, { ...product, quantity: 1 }]);
        }
      };

      const proceedToCheckout = () => {
        if (cart.length === 0) {
          alert('Your cart is empty!');
          return;
        }
        setCheckoutStarted(true);
      };

      const placeOrder = (customerInfo, cart) => {
        setCustomer(customerInfo);
        setOrderedCart(cart);
        setOrderPlaced(true);
        setCheckoutStarted(false);
        setCart([]);
      };

      return (
        <div>
          <Navbar />
          {!checkoutStarted && !orderPlaced && (
            <>
              <Hero />
              <Shop products={products} addToCart={addToCart} />
              <Cart cart={cart} setCart={setCart} proceedToCheckout={proceedToCheckout} />
              <About />
            </>
          )}
          {checkoutStarted && <Checkout cart={cart} placeOrder={placeOrder} />}
          {orderPlaced && <OrderConfirmation customer={customer} cart={orderedCart} />}
          <Contact />
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
